{% extends "base.html" %}
{% block libre %}
<div style="min-height:100vh;display:grid;place-items:center;padding:1rem;
  background:linear-gradient(150deg,#5b52e3 0%,#6d35c9 60%,#8b2fd1 100%)">
  <form method="post" class="tarjeta" style="width:min(400px,100%);padding:2.2rem;box-shadow:0 20px 50px rgba(30,20,90,.35)">
    {% csrf_token %}
    <div style="display:flex;flex-direction:column;align-items:center;gap:.7rem;margin-bottom:1.6rem">
      <span style="width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(140deg,#5b52e3,#7c3aed);box-shadow:0 8px 20px rgba(91,82,227,.4)">
        <svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <div style="font-weight:800;font-size:1.5rem;letter-spacing:-.02em">Candado</div>
      <div style="color:var(--pizarra);font-size:.92rem">Panel de administración</div>
    </div>
    {% for m in messages %}<div class="aviso error">{{ m }}</div>{% endfor %}
    <label>Usuario<input name="usuario" autofocus></label>
    <label>Contraseña<input type="password" name="clave"></label>
    <button class="boton" style="width:100%;justify-content:center">Entrar</button>
  </form>
</div>
{% endblock %}
