<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Candado{% endblock %} · Panel</title>
<style>
:root{
  --niebla:#e6ecee;--papel:#fff;--tinta:#172a31;--pizarra:#56696f;--linea:#cdd7da;
  --petroleo:#0d5c63;--petroleo-hondo:#0a3f45;--ok:#2c7f52;--alerta:#c07d0c;--error:#a8372b;--radio:8px;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
  color:var(--tinta);background:var(--niebla);
}
*{box-sizing:border-box}body{margin:0}
a{color:var(--petroleo);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:1.6rem;margin:0}h2{font-size:1.1rem;margin:0 0 .8rem}
code{background:var(--niebla);padding:.1em .4em;border-radius:4px;font-size:.88em}
.marco{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.lateral{background:var(--petroleo-hondo);color:#dfeeee;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.marca{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.3rem;color:#fff;margin-bottom:1.5rem}
.marca-i{width:16px;height:20px;border:3px solid #fff;border-radius:4px;position:relative}
.marca-i::before{content:"";position:absolute;left:50%;top:-10px;width:9px;height:9px;border:3px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;transform:translateX(-50%)}
.lateral a{color:#dfeeee;padding:.55rem .75rem;border-radius:var(--radio)}
.lateral a:hover{background:rgba(255,255,255,.08);text-decoration:none}
.lateral a.on{background:#fff;color:var(--petroleo-hondo);font-weight:600}
.lateral .pie{margin-top:auto;font-size:.85rem}
.contenido{padding:2rem 2.5rem 4rem;max-width:1100px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.boton{display:inline-block;background:var(--petroleo);color:#fff;border:0;border-radius:var(--radio);padding:.55rem 1.05rem;font:inherit;font-weight:600;cursor:pointer}
.boton:hover{background:var(--petroleo-hondo);text-decoration:none}
.boton.sec{background:var(--papel);color:var(--petroleo);box-shadow:inset 0 0 0 1.5px var(--petroleo)}
.boton.peligro{background:var(--papel);color:var(--error);box-shadow:inset 0 0 0 1.5px var(--error)}
.boton.mini{padding:.35rem .7rem;font-size:.85rem}
input,select,textarea{font:inherit;width:100%;padding:.5rem .65rem;border:1.5px solid var(--linea);border-radius:var(--radio);background:#fff;color:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--petroleo);box-shadow:0 0 0 3px rgba(13,92,99,.15)}
label{display:block;font-weight:600;margin-bottom:1rem}
label small{font-weight:400;color:var(--pizarra)}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:var(--radio);padding:1.5rem;margin-bottom:1rem}
.tabla{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden}
.tabla th,.tabla td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--linea)}
.tabla th{background:#f4f7f8;color:var(--pizarra);font-size:.9rem}
.tabla tr:last-child td{border-bottom:0}
.resumen{display:flex;gap:1.2rem;color:var(--pizarra);margin:.4rem 0 0;flex-wrap:wrap}
.punto{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:.3rem}
.ok{background:var(--ok)}.alerta{background:var(--alerta)}.gris{background:var(--pizarra)}
.et{font-size:.8rem;font-weight:600;padding:.12rem .55rem;border-radius:999px}
.et.ok{background:#e3f1ea;color:var(--ok)}.et.alerta{background:#fbefd6;color:#8a5a06}.et.gris{background:var(--niebla);color:var(--pizarra)}
.aviso{padding:.6rem .9rem;border-radius:var(--radio);margin-bottom:1rem}
.aviso.ok{background:#e3f1ea;color:#1f5c3b}.aviso.error{background:#f8e0dd;color:#7a241b}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem}
.tel{aspect-ratio:9/15;background:#fff;border:2px solid var(--tinta);border-radius:20px;padding:1.5rem .85rem 1rem;display:flex;flex-direction:column;gap:.25rem;position:relative;box-shadow:inset 0 5px 0 0 var(--color,var(--ok))}
.tel:hover{text-decoration:none;transform:translateY(-3px);transition:transform .12s}
.tel.off{--color:var(--pizarra);opacity:.7}.tel.vieja{--color:var(--alerta)}
.tel .bocina{position:absolute;top:11px;left:50%;width:32px;height:4px;border-radius:3px;background:var(--linea);transform:translateX(-50%)}
.tel .nom{font-weight:700;color:var(--tinta)}.tel .meta{font-size:.78rem;color:var(--pizarra)}
.tel .meta:last-child{margin-top:auto}
.ficha{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
.ficha dt{color:var(--pizarra)}.ficha dd{margin:0}
.restr{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1.5rem}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:400;margin:0;padding:.3rem 0}
.chk input{width:auto}
.vacio{background:#fff;border:1.5px dashed var(--linea);border-radius:var(--radio);padding:2.5rem;color:var(--pizarra);max-width:60ch}
.fila{display:flex;gap:.5rem;align-items:flex-end}.fila>*{margin-bottom:0}
@media(max-width:760px){.marco{grid-template-columns:1fr}.lateral{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.contenido{padding:1.2rem}.restr{grid-template-columns:1fr}}
.appicono{flex:none;width:34px;height:34px;border-radius:9px;background:var(--petroleo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem}
</style>
</head>
<body>
{% if user.is_authenticated %}
<div class="marco">
  <aside class="lateral">
    <div class="marca"><span class="marca-i"></span>Candado</div>
    <a href="{% url 'inicio' %}" class="{% if seccion == 'disp' %}on{% endif %}">Equipos</a>
    <a href="{% url 'politicas' %}" class="{% if seccion == 'pol' %}on{% endif %}">Políticas</a>
    <a href="{% url 'aplicaciones' %}" class="{% if seccion == 'app' %}on{% endif %}">Aplicaciones</a>
    <div class="pie"><a href="{% url 'salir' %}">Salir ({{ user.username }})</a></div>
  </aside>
  <main class="contenido">
    {% for m in messages %}<div class="aviso {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</div>
{% else %}
{% block libre %}{% endblock %}
{% endif %}
</body>
</html>
