# Blueprint de Render. Al conectar el repo, Render lee esto y crea todo solo.
databases:
  - name: candado-db
    databaseName: candado
    user: candado
    plan: free

services:
  - type: web
    name: candado-panel
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /entrar/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render genera una clave segura
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: AGENTE_TOKEN
        generateValue: true          # token de los teléfonos, generado seguro
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                  # lo defines tú en el panel de Render (no queda en el repo)
      - key: DB_HOST
        fromDatabase:
          name: candado-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: candado-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: candado-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: candado-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: candado-db
          property: password
