services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candado
      POSTGRES_USER: candado
      POSTGRES_PASSWORD: ${DB_PASSWORD:-candado_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped
    command: ./arranque.sh

volumes:
  pgdata:
