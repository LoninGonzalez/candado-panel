{% extends "base.html" %}
{% block libre %}
<div style="min-height:100vh;display:grid;place-items:center;padding:1rem">
  <form method="post" class="tarjeta" style="width:min(400px,100%)">
    {% csrf_token %}
    <div class="marca" style="color:var(--tinta);margin-bottom:1.5rem"><span class="marca-i" style="border-color:var(--petroleo)"></span>Candado</div>
    <h2>Panel de administración</h2>
    {% for m in messages %}<div class="aviso error">{{ m }}</div>{% endfor %}
    <label>Usuario<input name="usuario" autofocus></label>
    <label>Contraseña<input type="password" name="clave"></label>
    <button class="boton" style="width:100%">Entrar</button>
  </form>
</div>
{% endblock %}
